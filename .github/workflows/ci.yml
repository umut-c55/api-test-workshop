name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # nachts, Regression

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Push: Smoke. Pull Request und nachts: Regression (inkl. Smoke).
      MARKER: ${{ github.event_name == 'push' && 'smoke' || 'smoke or regression or negative' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: SUT starten
        run: docker compose up -d --build
      - name: Tests
        run: pytest -m "$MARKER" --html=report.html --self-contained-html
      - name: SUT-Log bei Fehler
        if: failure()
        run: docker compose logs sut
      - name: HTML-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html
